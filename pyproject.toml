[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xvg-plotter"
version = "1.0.0"
description = "Interactive cross-platform desktop viewer for GROMACS .xvg analysis files"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "matplotlib>=3.8", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
xvg-plotter = "xvg_plotter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xvg_plotter = ["assets/*"]
